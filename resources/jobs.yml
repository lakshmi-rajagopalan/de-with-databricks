resources:
  jobs:
    metric_views:
      name: metric-views
      tasks:
        - task_key: create_metric_views
          notebook_task:
            notebook_path: ../src/sql/metric_views.sql
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: create_report_views
          notebook_task:
            notebook_path: ../src/sql/report_views.sql
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

