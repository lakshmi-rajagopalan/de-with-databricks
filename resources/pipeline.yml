resources:
  pipelines:
    clickstream_workshop:
      name: clickstream-workshop
      catalog: ${var.catalog_name}
      target: ${resources.schemas.workshop.name}
      channel: CURRENT
      serverless: true
      configuration:
        raw_data_path: /Volumes/${var.catalog_name}/${resources.schemas.workshop.name}/${resources.volumes.raw.name}
      libraries:
        - notebook:
            path: ../src/dlt/bronze.py
        - notebook:
            path: ../src/dlt/silver.py
        - notebook:
            path: ../src/dlt/gold.py
        - notebook:
            path: ../src/dlt/star_schema.py
