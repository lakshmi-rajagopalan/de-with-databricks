bundle:
  name: de-with-databricks

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog for the DLT pipeline.
  schema_name:
    description: Unity Catalog schema used as DLT target (created by the bundle).
    default: clickstream_workshop
  warehouse_id:
    description: SQL warehouse ID used by Lakeview dashboards.
  genie_space_id:
    description: Genie space ID created by scripts/create_genie_space.sh.
    default: ""

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
