bundle:
  name: de-with-databricks

include:
  - resources/*.yml

variables:
  catalog_name:
    description: Unity Catalog catalog for the DLT pipeline (uses workspace default catalog).
    default: workspace
  schema_name:
    description: Unity Catalog schema used as DLT target (created by the bundle).
    default: clickstream_workshop
  warehouse_id:
    description: SQL warehouse ID used by Lakeview dashboards.
  client_dashboard_url:
    description: Published URL for the Client Demand Intelligence dashboard.
    default: "N/A"
  insights_dashboard_url:
    description: Published URL for the Clickstream Insights dashboard.
    default: "N/A"
  genie_space_url:
    description: URL for the Genie space used by the app shell.
    default: "N/A"

targets:
  dev:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
