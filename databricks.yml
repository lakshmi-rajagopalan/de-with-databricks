# Databricks Asset Bundle — Upwork Clickstream Workshop
#
# Deploys the DLT pipeline and a one-off setup job from git.
#
# Prerequisites:
#   1. Install Databricks CLI v0.200+  →  https://docs.databricks.com/dev-tools/cli/install.html
#   2. Authenticate                    →  databricks auth login --host <workspace-url>
#
# Usage:
#   databricks bundle validate          # check config
#   databricks bundle deploy            # create/update pipeline and job in your workspace
#   databricks bundle run setup_job     # copy CSVs to the UC volume (run once)
#   databricks bundle run dlt_pipeline  # start the DLT pipeline

bundle:
  name: clickstream-workshop

variables:
  catalog:
    default: workspace
    description: "Unity Catalog catalog name"
  schema:
    default: de
    description: "Schema / database name inside the catalog"

targets:
  # ── Development ──────────────────────────────────────────────────────────
  dev:
    default: true
    mode: development          # prefixes resource names with [dev <user>] automatically
    workspace:
      root_path: "~/.bundle/${bundle.name}/${target}"

  # ── Production ───────────────────────────────────────────────────────────
  prod:
    mode: production
    workspace:
      root_path: "/Shared/.bundle/${bundle.name}/${target}"

resources:

  # ── One-off setup job: creates schema/volume and copies CSVs ─────────────
  jobs:
    setup_job:
      name: "${bundle.name}-setup"
      tasks:
        - task_key: create_volume_and_copy_data
          notebook_task:
            notebook_path: ./data-workshop/etl/00_setup.py
            source: WORKSPACE
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: i3.xlarge
            num_workers: 0
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode

  # ── Dashboards ───────────────────────────────────────────────────────────
  #
  # .lvdash.json files embed SQL queries as datasets and are deployed via the
  # bundle. To create them standalone (without the bundle), use:
  #
  #   databricks lakeview create \
  #     --display-name "Clickstream Insights" \
  #     --serialized-dashboard "$(cat data-workshop/etl/dashboards/insights_dashboard.lvdash.json)"
  #
  # To update after editing the .lvdash.json:
  #
  #   databricks lakeview update <dashboard-id> \
  #     --serialized-dashboard "$(cat data-workshop/etl/dashboards/insights_dashboard.lvdash.json)"
  dashboards:
    insights_dashboard:
      display_name: "Clickstream Insights"
      file_path: ./data-workshop/etl/dashboards/insights_dashboard.lvdash.json

    quality_dashboard:
      display_name: "Data Quality"
      file_path: ./data-workshop/etl/dashboards/quality_dashboard.lvdash.json

  # ── DLT pipeline: bronze → silver → gold ─────────────────────────────────
  pipelines:
    dlt_pipeline:
      name: "${bundle.name}-pipeline"
      catalog: ${var.catalog}
      target: ${var.schema}
      development: true
      channel: CURRENT

      configuration:
        raw_data_path: "/Volumes/${var.catalog}/${var.schema}/raw"

      serverless: true

      libraries:
        - notebook:
            path: ./data-workshop/etl/transformations/01_bronze.py
        - notebook:
            path: ./data-workshop/etl/transformations/02_silver.py
        - notebook:
            path: ./data-workshop/etl/transformations/03_gold.py
        - notebook:
            path: ./data-workshop/etl/transformations/04_star_schema.py
